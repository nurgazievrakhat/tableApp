name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Быстрая проверка на Linux: типы и сборка бандлов. Нативный модуль здесь не
  # нужен, поэтому postinstall пропускаем — он тянет пересборку better-sqlite3.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Проверка типов
        run: npx tsc --noEmit
      - name: Сборка бандлов
        run: npx vite build

  # Установщик собирается только здесь: better-sqlite3 — нативный модуль, и с
  # macOS или Linux собрать его под Windows нельзя.
  windows:
    needs: check
    runs-on: windows-latest
    # Токену по умолчанию дан только доступ на чтение, а шагу «Релиз по тегу»
    # нужно создать релиз. Право выдано точечно этой задаче, а не всему
    # workflow.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Тег обязан совпадать с версией в package.json: иначе релиз выйдет, а
      # обновление в приложении не предложится — оно сравнивает версии, а не теги.
      - name: Сверка тега с версией
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $pkg в package.json" >&2
            exit 1
          fi

      - name: Сборка установщика
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run dist:win

      # На теге публикуем сами: electron-builder кладёт в релиз не только .exe,
      # но и latest.yml с blockmap — без них обновлятель новую версию не увидит,
      # а без blockmap качал бы установщик целиком вместо изменившихся кусков.
      - name: Релиз по тегу
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Артефакт
        uses: actions/upload-artifact@v6
        with:
          name: TableEasy-setup
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
